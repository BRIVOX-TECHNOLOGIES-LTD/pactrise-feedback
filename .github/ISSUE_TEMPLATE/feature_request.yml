name: Feature request
description: Propose a new Pactrise capability
title: "[Feature]: "
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Pactrise. Search existing issues first and **do not include confidential or personal information**.
  - type: dropdown
    id: audience
    attributes:
      label: Who would benefit?
      options:
        - Companies
        - Sales partners
        - Both
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and why the current experience falls short.
      placeholder: When I try to..., I cannot...
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a better outcome look like?
      description: Focus on the desired result; a detailed technical solution is not necessary.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: How important is this to your workflow?
      description: Optional context about frequency, impact, or a workaround.
